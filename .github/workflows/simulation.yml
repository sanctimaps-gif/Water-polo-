name: Simulation tests

on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Gameplay simulation tests (Core + Simulation, NUnit)
        run: dotnet test tools/SimTests --configuration Release
      - name: Unity layer compile check (Runtime + Editor against the Unity API)
        run: dotnet build tools/UnityCompileCheck --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web build — human controls reach the simulation
        run: node tools/web-tests/human-actions.mjs
      - name: Web build — game state rules (TOTAL, league, rewards, shop, events)
        run: node tools/web-tests/state.mjs
      - name: Web build — AI positioning (spacing, postes, goal-side defence)
        run: node tools/web-tests/positioning.mjs 6
