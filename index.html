<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Water Polo 26 Mobile</title>
<link rel="manifest" href="web/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="web/assets/icon-192.png">
<link rel="apple-touch-icon" href="web/assets/icon-192.png">
<script>
// Landscape only, automatically: when the phone is held upright the whole page is turned 90° (see game.js).
(function () { var d = document.documentElement, w = innerWidth, h = innerHeight, f = h > w, W = f ? h : w, H = f ? w : h;
  d.classList.toggle('fake-land', f); d.style.setProperty('--lw', W + 'px'); d.style.setProperty('--lh', H + 'px');
  d.style.setProperty('--vw', W / 100 + 'px'); d.style.setProperty('--vh', H / 100 + 'px'); })();
</script>
<link rel="stylesheet" href="web/style.css">
<link rel="stylesheet" href="web/ui/ui.css">
</head>
<body>
<div id="view"></div>

<!-- BOOT SPLASH: the game logo while the 3D scene loads -->
<div id="splash"><img src="web/assets/logo.webp" alt="Water Polo 26 Mobile" width="512" height="512"><i></i></div>

<!-- FRONT-END (home, team, events, shop...) -->
<div id="app" class="app hidden"></div>

<!-- MATCH HUD -->
<div id="hud" class="hidden">
  <div id="stick-zone"><div id="stick"><div id="knob"></div></div></div>
  <div id="right-zone"></div>

  <div id="board">
    <div class="teams">
      <span id="home-crest" class="crest"></span>
      <span id="home-chip" class="chip"><span id="home-name">RIV</span><u class="poss"></u></span>
      <b id="home-score">0</b><i>-</i><b id="away-score">0</b>
      <span id="away-chip" class="chip"><span id="away-name">NOR</span><u class="poss"></u></span>
      <span id="away-crest" class="crest"></span>
    </div>
    <div class="clocks"><span id="clock">P1 02:00</span><span id="shotclock">30</span></div>
    <div id="manup" hidden></div>
  </div>
  <button id="tactic">TACTIQUE</button>
  <button id="camBtn" class="hud-chip">CAM</button>
  <button id="soundBtn" class="hud-chip">🔊</button>
  <button id="pauseBtn" class="hud-chip">II</button>
  <div id="replay" class="hidden"><b id="replay-title">REPLAY</b><span id="replay-skip"></span></div>
  <div id="info"></div>
  <canvas id="radar" width="162" height="126"></canvas>

  <div id="toast"></div>
  <div id="banner" class="hidden"></div>
  <div id="olabel"></div>
  <div id="goalcard"></div>
  <div id="confetti"></div>
  <div id="lineup" class="hidden"></div>
  <button id="skipBtn" class="hidden" aria-label="skip">&#9654;&#10073;</button>
  <div id="drill" class="hidden"></div>
  <div id="flash"></div>
  <div id="tacpanel" class="hidden"></div>
  <div id="intro" class="hidden"></div>
  <div id="bars">
    <div id="who"></div><i id="pl-tri"></i>
    <div id="timing"></div>
    <div id="charge-wrap"><div id="zone"></div><div id="charge"></div></div>
    <div id="stamina-wrap"><div id="stamina"></div></div>
  </div>

  <button id="btnS" class="action" data-mode="sprint">SPRINT</button>
  <button id="btnD" class="action" data-mode="dodge">PASSER LE JOUEUR</button>
  <button id="btnB" class="action">PASSE</button>
  <button id="btnA" class="action">TIR</button>
</div>

<div id="pause" class="hidden">
  <div class="pz-card"><div class="pz-tag" id="pause-title">JEU EN PAUSE</div><div class="pz-head" id="pause-score"></div><div class="pz-body" id="pause-panel"></div></div>
  <button id="pause-resume" class="pz-back" aria-label="resume">&#10094;</button>
  <div class="pz-btns">
    <button id="pause-stats" aria-label="stats"></button><button id="pause-tactics" aria-label="tactics"></button><button id="pause-team" aria-label="team"></button>
    <button id="pause-settings" aria-label="settings"></button><button id="pause-quit" aria-label="quit"></button>
  </div>
</div>

<!-- LANDSCAPE ONLY: shown (and the game paused) whenever the device is held vertically -->
<div id="rotate" class="hidden">
  <img class="rot-logo" src="web/assets/icon-192.png" alt="" width="96" height="96">
  <div class="phone"><div class="screen"></div></div>
  <h1 id="rotate-title">TOURNEZ VOTRE APPAREIL</h1>
  <p id="rotate-hint">Water Polo 26 se joue uniquement à l'horizontale</p>
</div>

<script type="module" src="web/game.js"></script>
</body>
</html>
